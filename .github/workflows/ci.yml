name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Confidentialité des artefacts publiables
        run: pytest tests/test_privacy.py
      - name: Tests hors réseau
        run: pytest
      - name: Build package
        run: python -m build

  container:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --tag rat-king:ci .

  publish:
    needs:
      - quality
      - container
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag
        id: metadata
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rat-king" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build release image
        run: >-
          docker build
          --tag "${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.version }}"
          --tag "${{ steps.metadata.outputs.image }}:latest"
          --tag "${{ steps.metadata.outputs.image }}:sha-${GITHUB_SHA}"
          .
      - name: Push release image
        run: |
          docker push "${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.version }}"
          docker push "${{ steps.metadata.outputs.image }}:latest"
          docker push "${{ steps.metadata.outputs.image }}:sha-${GITHUB_SHA}"
